services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zetro
      POSTGRES_PASSWORD: zetro
      POSTGRES_DB: zetro
    ports:
      - "5432:5432"
    volumes:
      - zetro_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zetro_minio:/data

volumes:
  zetro_pg:
  zetro_minio:
