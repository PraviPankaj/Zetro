# Render — ONE service (API + shop UI), like localhost
# https://zetro.onrender.com/abc

databases:
  - name: zetro-db
    plan: free
    databaseName: zetro
    user: zetro

services:
  - type: web
    name: zetro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zetro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SMS_PROVIDER
        value: console
      - key: USE_MEMORY_OTP
        value: "true"
      - key: DEMO_BYPASS_ENABLED
        value: "true"
      - key: DEMO_SHOP_SLUG
        value: abc
      - key: DEMO_SHOP_PHONE
        value: "9999999999"
      - key: PLATFORM_DEFAULT_USERNAME
        value: admin
      - key: PLATFORM_DEFAULT_PASSWORD
        value: admin
      - key: CORS_ORIGINS
        value: https://zetro.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: API_INTERNAL_URL
        value: http://127.0.0.1:8000
