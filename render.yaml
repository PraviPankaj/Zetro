# Render — native Python + Node (no Docker). For testing only.
#
# Shop UI:  https://zetro.onrender.com/abc
# API:      https://zetro-api.onrender.com

databases:
  - name: zetro-db
    plan: free
    databaseName: zetro
    user: zetro

services:
  - type: web
    name: zetro-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash start-api.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: zetro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SMS_PROVIDER
        value: console
      - key: USE_MEMORY_OTP
        value: "true"
      - key: DEMO_BYPASS_ENABLED
        value: "true"
      - key: DEMO_SHOP_SLUG
        value: abc
      - key: DEMO_SHOP_PHONE
        value: "9999999999"
      - key: PLATFORM_DEFAULT_USERNAME
        value: admin
      - key: PLATFORM_DEFAULT_PASSWORD
        value: admin
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: zetro
          envVarKey: RENDER_EXTERNAL_URL
      - key: CHATGPT_API_KEY
        sync: false

  - type: web
    name: zetro
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: zetro-api
          envVarKey: RENDER_EXTERNAL_URL
